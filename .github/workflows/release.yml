name: Release to PyPI and npm

on:
  push:
    tags:
      - 'v*'

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies & run tests
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
          pytest tests/test_auto_dispatch.py

  publish:
    needs: validate
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write

    steps:
      - uses: actions/checkout@v4

      - name: Extract version from git tag
        id: get_version
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          echo "VERSION=$VERSION" >> $GITHUB_OUTPUT
          echo "Releasing version: $VERSION"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          registry-url: 'https://registry.npmjs.org'

      # Synchronize version across pyproject.toml and npm package.json files
      - name: Synchronize version files
        run: |
          VERSION="${{ steps.get_version.outputs.VERSION }}"
          sed -i 's/^version = .*/version = "'"$VERSION"'"/' pyproject.toml
          cd packages/rev-decision && npm version "$VERSION" --no-git-tag-version --allow-same-version && cd ../..
          cd packages/rev-server && npm version "$VERSION" --no-git-tag-version --allow-same-version && cd ../..

      # 1. Build and Publish Python Package to PyPI
      - name: Build Python wheel and sdist
        run: |
          python -m pip install --upgrade pip build
          python -m build

      - name: Publish Python package to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          password: ${{ secrets.PYPI_API_TOKEN }}
          skip-existing: true

      # 2. Build and Publish TypeScript / Node Package to npm
      - name: Build and Publish rev-decision to npm
        working-directory: packages/rev-decision
        run: |
          npm ci || npm install
          npm run build
          npm publish --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Publish rev-server to npm
        working-directory: packages/rev-server
        run: |
          npm publish --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      # 3. Create GitHub Release
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: rev v${{ steps.get_version.outputs.VERSION }}
          generate_release_notes: true
