name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    name: Test (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest
          pip install -e .

      - name: Verify package exports & PEP 561 marker
        run: |
          python -c "import rev; assert hasattr(rev, 'predict'); assert hasattr(rev, 'Model'); assert hasattr(rev, 'presets'); print('rev imported successfully')"
          test -f rev/py.typed

      - name: Run unit tests
        run: |
          pytest tests/test_unified_model.py tests/test_kv_cache.py -v
