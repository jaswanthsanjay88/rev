[project]
name = "rev"
version = "0.1.0"
description = "Prefill-only decision model with TypeSafe System One API"
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
license-files = ["LICENSE"]
dependencies = [
    "torch",
    "transformers>=4.48.0",
    "peft>=0.14.0",
    "datasets>=3.0.0",
    "accelerate>=1.0.0",
    "pydantic>=2.8.0",
    "fastapi>=0.115.0",
    "uvicorn>=0.30.0",
    "numpy",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "httpx>=0.27.0",
    "pyngrok>=7.0.0",
]
